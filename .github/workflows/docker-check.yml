
name: PWDWork Docker Build Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build PWDWork Docker image
        run: docker build --pull -t pwdwork-render:check .

      - name: Verify PHP inside Docker
        run: docker run --rm --entrypoint php pwdwork-render:check -v

      - name: Test Render Secret File access without network or credentials
        run: |
          docker run --rm --network none \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.github/scripts/test-render-secret-access.sh,dst=/run/test-render-secret-access.sh,readonly" \
            --entrypoint sh pwdwork-render:check /run/test-render-secret-access.sh

      - name: Confirm image exists
        run: docker image inspect pwdwork-render:check
